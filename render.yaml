services:
  - type: web
    name: creative-ops-erp-api
    runtime: docker
    repo: https://github.com/parthyk/creative-ops-erp
    branch: main
    region: oregon
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://web-pi-rose-49.vercel.app
      - key: STORAGE_DRIVER
        value: r2
      - key: S3_ENDPOINT
        value: https://eba5794e14add119f502bcc7de701d37.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: creative-ops-erp
      - key: S3_PUBLIC_URL
        value: https://pub-bab0b57df2144f89856a1e8b36c65b5d.r2.dev
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: creative-ops-erp-db
          property: connectionString

databases:
  - name: creative-ops-erp-db
    plan: free
    region: oregon
