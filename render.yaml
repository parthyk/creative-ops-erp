services:
  - type: web
    name: creative-ops-erp-api
    runtime: docker
    repo: https://github.com/parthyk/creative-ops-erp
    branch: main
    region: oregon
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://web-pi-rose-49.vercel.app
      - key: STORAGE_DRIVER
        value: local
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: creative-ops-erp-db
          property: connectionString

databases:
  - name: creative-ops-erp-db
    plan: free
    region: oregon
